<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotsArchive — 2085 Telegram Bots Catalog | Search by Tags, Rating, Languages</title>
<meta name="description" content="The most powerful archive of Telegram bots. Browse 2085 bots in English, Russian and Persian. Search by tags, rating, languages, and category.">
<meta name="keywords" content="Telegram bots, bot directory, Telegram bot catalog, Telegram bot search">
<link rel="canonical" href="https://tgbotarchive.com/">
<link rel="alternate" hreflang="en" href="https://tgbotarchive.com/">
<link rel="alternate" hreflang="ru" href="https://tgbotarchive.com/?lang=ru">
<link rel="alternate" hreflang="fa" href="https://tgbotarchive.com/?lang=fa">
<meta property="og:title" content="BotsArchive — 2085 Telegram Bots">
<meta property="og:description" content="Browse and search 2085 Telegram bots with descriptions in 3 languages.">
<meta property="og:url" content="https://tgbotarchive.com/">
<meta property="og:type" content="website">
<meta name="robots" content="index, follow"></head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T2JST9VG"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="hero">
    <div class="hero-logo">🤖</div>
    <h1>BotsArchive</h1>
    <p>2000+ Telegram bots · 3 languages · Search & discover</p>
    <a href="https://t.me/tgbotarchivesupportbot" target="_blank" style="display:inline-block;margin-top:0.6rem;padding:0.35rem 0.9rem;border-radius:20px;border:1px solid var(--accent);color:var(--accent);font-size:0.82rem;font-weight:500;text-decoration:none;transition:all .2s;background:var(--accent-soft);" onmouseover="this.style.background='var(--accent)';this.style.color='#fff'" onmouseout="this.style.background='var(--accent-soft)';this.style.color='var(--accent)'">💬 Feedback & Suggest a bot</a>
    <div class="lang-switch">
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">🇬🇧 English</button>
        <button class="lang-btn" data-lang="ru" onclick="switchLang('ru')">🇷🇺 Русский</button>
        <button class="lang-btn" data-lang="fa" onclick="switchLang('fa')">🇮🇷 فارسی</button>
    </div>
</div>

<div class="controls-wrap">
    <div class="controls">
        <div class="search-row">
            <input type="text" id="search" placeholder="Search by name, description, or tag..." oninput="filterBots()" autocomplete="off">
            <select class="sort-select" id="sort" onchange="filterBots()">
                <option value="date">📅 Newest</option>
                <option value="rating">⭐ Best Rating</option>
                <option value="votes">🗳 Most Votes</option>
                <option value="views">👁 Most Viewed</option>
                <option value="name">🔤 A–Z</option>
            </select>
        </div>
        <div class="stats-bar">
            <span id="stats">Loading...</span>
            <button class="clear-btn" id="clearBtn" onclick="clearFilters()">✕ Clear filters</button>
        </div>
    </div>
</div>

<div class="tag-bar"><div class="tag-list" id="tagList"></div></div>

<div class="grid" id="grid">
    <div class="loading"><div class="spinner"></div><div>Loading bots...</div></div>
</div>

<footer>
    Powered by <a href="https://t.me/tgbotarchive">@TGBotArchive</a> ·
    <a href="https://t.me/tgbotarchivesupportbot" target="_blank">💬 Feedback / Suggest a bot</a>
</footer>

<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <div class="detail-card" id="detailCard"></div>
</div>

<script>
let data = [];
let filteredData = [];
let lang = localStorage.getItem('botsarchive-lang') || 'en';
let activeTag = null;

async function loadData() {
    try {
        const resp = await fetch('data.json');
        data = await resp.json();
        try {
            const tagResp = await fetch('tags.json');
            window.allTags = await tagResp.json();
        } catch(e) { window.allTags = []; }
        
        document.getElementById('stats').textContent = `${data.length} bots cataloged`;
        renderTags();
        switchLang(lang);
        filterBots();
    } catch(e) {
        document.getElementById('grid').innerHTML = '<div class="loading">Failed to load data. <a href="https://t.me/BotsArchive">Open in Telegram</a></div>';
    }
}

function switchLang(l) {
    lang = l;
    localStorage.setItem('botsarchive-lang', l);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    filterBots();
}

function renderTags() {
    const tags = window.allTags || [];
    const container = document.getElementById('tagList');
    container.innerHTML = tags.slice(0, 60).map(t =>
        `<button class="tag-pill" data-tag="${esc(t)}" onclick="toggleTag('${esc(t)}')">#${esc(t)}</button>`
    ).join('');
}

function toggleTag(tag) {
    if (activeTag === tag) { clearTag(); return; }
    activeTag = tag;
    document.querySelectorAll('.tag-pill').forEach(t => t.classList.toggle('active', t.dataset.tag === tag));
    document.getElementById('clearBtn').classList.add('show');
    filterBots();
}

function clearTag() {
    activeTag = null;
    document.querySelectorAll('.tag-pill').forEach(t => t.classList.remove('active'));
    document.getElementById('clearBtn').classList.remove('show');
    filterBots();
}

function clearFilters() {
    document.getElementById('search').value = '';
    clearTag();
}

function getDesc(bot) {
    if (lang === 'ru') return bot.dr || bot.d;
    if (lang === 'fa') return bot.df || bot.d;
    return bot.d;
}

function filterBots() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const sort = document.getElementById('sort').value;
    
    let visible = data.filter(bot => {
        if (q) {
            const searchable = [bot.u, bot.n, bot.d, bot.dr, bot.df, ...(bot.t || []), bot.l].join(' ').toLowerCase();
            if (!searchable.includes(q)) return false;
        }
        if (activeTag && (!bot.t || !bot.t.includes(activeTag))) return false;
        return true;
    });
    
    visible.sort((a, b) => {
        let cmp;
        switch(sort) {
            case 'rating': cmp = (b.r || 0) - (a.r || 0); break;
            case 'votes': cmp = (b.v || 0) - (a.v || 0); break;
            case 'views': cmp = (b.w || 0) - (a.w || 0); break;
            case 'name': cmp = (a.n || '').localeCompare(b.n || ''); break;
            default: cmp = (b.dt || '').localeCompare(a.dt || ''); break;
        }
        if (cmp !== 0) return cmp;
        return (b.v || 0) - (a.v || 0); // tiebreaker
    });
    
    filteredData = visible;
    document.getElementById('stats').textContent = `${visible.length} of ${data.length} bots`;
    renderGrid(visible);
}

function renderStars(n) {
    n = Math.min(Math.max(Math.round(n), 0), 5);
    return '⭐'.repeat(n) + '☆'.repeat(5 - n);
}

function formatNumber(n) {
    if (!n) return '';
    if (n >= 1000) return (n/1000).toFixed(1).replace('.0','') + 'k';
    return n.toLocaleString();
}

function renderGrid(bots) {
    const grid = document.getElementById('grid');
    if (bots.length === 0) {
        grid.innerHTML = '<div class="loading"><div style="font-size:2rem;margin-bottom:0.5rem;">🔍</div><div>No bots found</div></div>';
        return;
    }
    
    grid.innerHTML = bots.map(bot => {
        const desc = getDesc(bot);
        const shortDesc = desc.length > 130 ? desc.slice(0, 130) + '…' : desc;
        const tags = (bot.t || []).slice(0, 4);
        
        return `<div class="card" onclick="showDetail('${esc(bot.u)}')">
            <img class="card-avatar" src="https://t.me/i/userpic/320/${esc(bot.u)}.jpg" alt="" loading="lazy" onerror="this.style.display='none'" onload="this.style.opacity=1">
            <div class="card-body">
            <div class="card-top">
                <div>
                    <div class="card-name">${esc(bot.n)}</div>
                    <div class="card-username">@${esc(bot.u)}</div>
                </div>
                <div class="card-rating">${renderStars(bot.s)} <span>${bot.r ? bot.r.toFixed(1) : '—'}</span></div>
            </div>
            <div class="card-desc">${esc(shortDesc)}</div>
            ${tags.length ? '<div class="card-tags">' + tags.map(t => '<button class="card-tag" onclick="event.stopPropagation();toggleTag(\'' + esc(t) + '\')">#' + esc(t) + '</button>').join('') + '</div>' : ''}
            <div class="card-meta">
                ${bot.v ? '<span>🗳 ' + formatNumber(bot.v) + '</span>' : ''}
                ${bot.w ? '<span>👁 ' + formatNumber(bot.w) + '</span>' : ''}
                ${bot.l ? '<span>🌐 ' + esc(bot.l.split(' ')[0]) + (bot.l.includes(' ') ? ' +' + (bot.l.split(' ').length-1) : '') + '</span>' : ''}
                ${bot.dt ? '<span>' + dateAgo(bot.dt) + '</span>' : ''}
            </div>
            </div>
        </div>`;
    }).join('');
}

function showDetail(username) {
    const bot = data.find(b => b.u === username);
    if (!bot) return;
    
    const overlay = document.getElementById('detailOverlay');
    overlay.classList.add('open');
    
    document.getElementById('detailCard').innerHTML = `
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="detail-img-wrap"><img class="detail-img" src="https://t.me/i/userpic/320/${esc(bot.u)}.jpg" alt="" onerror="this.style.display='none'"></div>
        <div class="card-name">${esc(bot.n)}</div>
        <div class="card-username">@${esc(bot.u)}</div>
        <div class="detail-rating">
            <span style="color:var(--star);font-size:1.1rem;">${renderStars(bot.s)}</span>
            <span style="color:var(--text-dim);font-size:0.9rem;">${bot.r ? bot.r.toFixed(1) : '—'}</span>
            ${bot.v ? '<span style="color:var(--text-muted);font-size:0.8rem;">· ' + formatNumber(bot.v) + ' votes</span>' : ''}
        </div>
        
        <div class="detail-lang-section">
            <div class="detail-lang-label">🇬🇧 English</div>
            <div class="detail-desc">${esc(bot.d)}</div>
        </div>
        ${bot.dr && bot.dr !== bot.d ? '<div class="detail-lang-section"><div class="detail-lang-label">🇷🇺 Русский</div><div class="detail-desc">' + esc(bot.dr) + '</div></div>' : ''}
        ${bot.df && bot.df !== bot.d ? '<div class="detail-lang-section"><div class="detail-lang-label">🇮🇷 فارسی</div><div class="detail-desc fa" dir="rtl">' + esc(bot.df) + '</div></div>' : ''}
        
        <div class="detail-grid">
            <div>🌐 Languages: <span>${esc(bot.l || '—')}</span></div>
            <div>💬 Inline: <span>${bot.i || 'no'}</span></div>
            <div>👥 Groups: <span>${bot.g || 'no'}</span></div>
            <div>👁 Views: <span>${bot.w ? formatNumber(bot.w) : '—'}</span></div>
        </div>
        
        ${(bot.t || []).length ? '<div class="detail-tags">' + bot.t.map(t => '<button class="card-tag" onclick="event.stopPropagation();closeDetail();toggleTag(\'' + esc(t) + '\')">#' + esc(t) + '</button>').join('') + '</div>' : ''}
        
        <a class="open-btn" href="https://t.me/${esc(bot.u)}" target="_blank">
            🤖 Open @${esc(bot.u)}
        </a>
    `;
}

function closeDetail(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('detailOverlay').classList.remove('open');
}

function dateAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const diff = (now - d) / 86400000;
    if (diff < 1) return 'today';
    if (diff < 30) return Math.round(diff) + 'd ago';
    if (diff < 365) return Math.round(diff / 30) + 'mo ago';
    return Math.round(diff / 365) + 'y ago';
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDetail(); }
    if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
        e.preventDefault();
        document.getElementById('search').focus();
    }
});

loadData();
</script>
</body>
</html>
