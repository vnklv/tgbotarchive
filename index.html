<body>

<header>
    <h1>🤖 BotsArchive</h1>
    <p>The most powerful archive of Telegram bots</p>
    <div class="lang-switch">
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">🇬🇧 English</button>
        <button class="lang-btn" data-lang="ru" onclick="switchLang('ru')">🇷🇺 Русский</button>
        <button class="lang-btn" data-lang="fa" onclick="switchLang('fa')">🇮🇷 فارسی</button>
        <a href="https://t.me/tgbotarchivesupportbot" target="_blank" style="color:#6c63ff;font-size:0.82rem;text-decoration:none;margin-left:0.8rem;white-space:nowrap;">💬 Feedback</a>
    </div>
    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="search" placeholder="Search bots..." oninput="filterBots()" autocomplete="off">
            <select class="sort-select" id="sort" onchange="filterBots()">
                <option value="date">Newest</option>
                <option value="rating">Best Rating</option>
                <option value="votes">Most Votes</option>
                <option value="views">Most Views</option>
                <option value="name">Name A-Z</option>
            </select>
        </div>
        <div id="tagArea">
            <div class="tag-search-wrap">
                <input type="text" id="tagSearch" placeholder="Search tags..." oninput="searchTag()" autocomplete="off">
                <div class="tag-suggestions" id="tagSuggestions"></div>
            </div>
            <div class="tag-active-label" id="tagActiveLabel"></div>
        </div>
        <div class="stats" id="stats">Loading...</div>
    </div>
</header>

<div class="grid" id="grid">
    <div class="loading"><div class="spinner"></div>Loading bots...</div>
</div>

<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <div class="detail-card" id="detailCard"></div>
</div>

<footer>
    Powered by <a href="https://t.me/BotsArchive">@BotsArchive</a> |
    <a href="https://t.me/BotsArchiveSupportbot" target="_blank">💬 Feedback / Suggest a bot</a>
</footer>

<script>
// ── Data ──
const PAGE_SIZE = 60;
let data = [];
let filteredData = [];
let lang = localStorage.getItem('botsarchive-lang') || 'en';
let activeTag = null;
let loadQueue = [];

// ── Load ──
async function loadData() {
    try {
        const resp = await fetch('data.json');
        data = await resp.json();
        
        fetch('tags.json').then(r => r.json()).then(t => {
            window.allTags = t;
        }).catch(() => { window.allTags = []; });
        
        document.getElementById('stats').textContent = `${data.length} bots cataloged`;
        renderTags();
        switchLang(lang);
        filterBots();
    } catch(e) {
        document.getElementById('grid').innerHTML = '<div class="loading">Failed to load data. <a href="https://t.me/BotsArchive">Open in Telegram</a></div>';
    }
}

// ── Chunked rendering ──
function renderChunked(items, cb, chunkSize) {
    const chunk = chunkSize || 12;
    let i = 0;
    function next() {
        const end = Math.min(i + chunk, items.length);
        for (; i < end; i++) cb(items[i], i);
        if (i < items.length) requestAnimationFrame(next);
    }
    requestAnimationFrame(next);
}

// ── Language ──
function switchLang(l) {
    lang = l;
    localStorage.setItem('botsarchive-lang', l);
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === l);
    });
    filterBots();
}

// ── Tag Search ──
function renderTags() {
    window.tagFreq = {};
    for (const bot of data) {
        for (const t of (bot.t || [])) {
            window.tagFreq[t] = (window.tagFreq[t] || 0) + 1;
        }
    }
    updateTagLabel();
}

function searchTag() {
    const q = document.getElementById('tagSearch').value.toLowerCase().trim();
    const suggestions = document.getElementById('tagSuggestions');
    if (!q || q.length < 1) {
        suggestions.style.display = 'none';
        return;
    }
    let matches = Object.entries(window.tagFreq || {})
        .filter(([tag]) => tag.toLowerCase().includes(q))
        .sort((a, b) => b[1] - a[1])
        .slice(0, 12);
    if (matches.length === 0) { suggestions.style.display = 'none'; return; }
    suggestions.style.display = 'block';
    suggestions.innerHTML = matches.map(([tag, count]) =>
        `<div class="tag-suggestion-item" onclick="selectTag('${esc(tag)}')">
            <span class="tag-suggestion-tag">#${esc(tag)}</span>
            <span class="tag-suggestion-count">${count} bots</span>
        </div>`
    ).join('');
}

function selectTag(tag) {
    if (activeTag === tag) { clearTag(); }
    else {
        activeTag = tag;
        document.getElementById('tagSearch').value = '#' + tag;
        updateTagLabel();
        filterBots();
    }
    document.getElementById('tagSuggestions').style.display = 'none';
}

function updateTagLabel() {
    const label = document.getElementById('tagActiveLabel');
    if (activeTag) {
        label.innerHTML = `Filtered by tag: <strong>#${esc(activeTag)}</strong> <button class="tag-clear-btn" onclick="clearTag()">✕ Clear</button>`;
        label.classList.add('show');
    } else {
        label.classList.remove('show');
        label.innerHTML = '';
        document.getElementById('tagSearch').value = '';
    }
}

function clearTag() { activeTag = null; updateTagLabel(); filterBots(); }

function getDesc(bot) {
    if (lang === 'ru') return bot.dr || bot.d;
    if (lang === 'fa') return bot.df || bot.d;
    return bot.d;
}

// ── Filter & Sort ──
function filterBots() {
    const q = document.getElementById('search').value.toLowerCase();
    const sort = document.getElementById('sort').value;
    
    let visible = data.filter(bot => {
        if (q) {
            const searchable = [bot.u, bot.n, bot.d, bot.dr, bot.df, ...(bot.t || []), bot.l].join(' ').toLowerCase();
            if (!searchable.includes(q)) return false;
        }
        if (activeTag && (!bot.t || !bot.t.includes(activeTag))) return false;
        return true;
    });
    
    visible.sort((a, b) => {
        switch(sort) {
            case 'rating': return (b.r || 0) - (a.r || 0);
            case 'votes': return (b.v || 0) - (a.v || 0);
            case 'views': return (b.w || 0) - (a.w || 0);
            case 'name': return (a.n || '').localeCompare(b.n || '');
            default: return (b.dt || '').localeCompare(a.dt || '');
        }
    });
    
    filteredData = visible;
    document.getElementById('stats').textContent = `${visible.length} of ${data.length} bots`;
    renderGrid(visible);
}

function renderStars(n) { return '⭐'.repeat(Math.min(Math.round(n), 5)); }

// ── Render Grid (chunked) ──
function renderGrid(bots) {
    const grid = document.getElementById('grid');
    if (bots.length === 0) {
        grid.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-dim);grid-column:1/-1;">No bots found</div>';
        return;
    }
    
    const firstBatch = bots.slice(0, PAGE_SIZE);
    const rest = bots.slice(PAGE_SIZE);
    
    grid.innerHTML = firstBatch.map(bot => buildCard(bot)).join('');
    
    if (rest.length > 0) {
        renderChunked(rest, (bot) => {
            grid.appendChild(botToElement(bot));
        });
    }
}

function buildCard(bot) {
    const desc = getDesc(bot);
    const shortDesc = desc.length > 150 ? desc.slice(0, 150) + '...' : desc;
    const tags = (bot.t || []).slice(0, 5);
    
    return `<div class="card" onclick="window.location.href='/b/${bot.u}.html'">
        <div class="card-header">
            <div>
                <div class="card-name">${esc(bot.n)}</div>
                <div class="card-username">@${esc(bot.u)}</div>
            </div>
            <div class="card-rating">${renderStars(bot.s)} ${bot.r ? bot.r.toFixed(1) : '—'}</div>
        </div>
        <div class="card-desc">${esc(shortDesc)}</div>
        ${tags.length ? '<div class="card-tags">' + tags.map(t => '<span class="card-tag" onclick="event.stopPropagation();selectTag(\'' + esc(t) + '\')">#' + esc(t) + '</span>').join('') + '</div>' : ''}
        <div class="card-meta">
            ${bot.v ? '🗳 ' + bot.v + ' votes' : ''}
            ${bot.w ? '👁 ' + bot.w.toLocaleString() : ''}
            ${bot.l ? '🌐 ' + bot.l.split(' ')[0] + (bot.l.includes(' ') ? ' +' + (bot.l.split(' ').length-1) : '') : ''}
            ${dateAgo(bot.dt)}
        </div>
    </div>`;
}

function botToElement(bot) {
    const div = document.createElement('div');
    div.innerHTML = buildCard(bot);
    return div.firstElementChild;
}

// ── Detail View ──
function showDetail(username) {
    const bot = data.find(b => b.u === username);
    if (!bot) return;
    
    const overlay = document.getElementById('detailOverlay');
    overlay.classList.add('open');
    
    document.getElementById('detailCard').innerHTML = `
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="card-name">${esc(bot.n)}</div>
        <div class="card-username">@${esc(bot.u)}</div>
        <div style="display:flex;gap:0.5rem;margin:0.3rem 0;">
            <span class="card-rating">${renderStars(bot.s)} ${bot.r ? bot.r.toFixed(1) : ''}</span>
            ${bot.v ? '<span style="color:var(--text-dim);font-size:0.85rem;">🗳 ' + bot.v + ' votes</span>' : ''}
        </div>
        <div class="detail-lang-label">🇬🇧 English</div>
        <div class="card-desc">${esc(getLangDesc(bot, 'en'))}</div>
        <div class="detail-lang-label">🇷🇺 Русский</div>
        <div class="card-desc">${esc(getLangDesc(bot, 'ru'))}</div>
        <div class="detail-lang-label">🇮🇷 فارسی</div>
        <div class="card-desc" dir="rtl">${esc(getLangDesc(bot, 'fa'))}</div>
        <div class="detail-info">
            <div>🌐 Languages: <span>${esc(bot.l || '—')}</span></div>
            <div>💬 Inline: <span>${bot.i || 'no'}</span></div>
            <div>👥 Groups: <span>${bot.g || 'no'}</span></div>
            <div>👁 Views: <span>${bot.w ? bot.w.toLocaleString() : '—'}</span></div>
        </div>
        ${(bot.t || []).length ? '<div class="card-tags" style="margin:0.5rem 0;">' + bot.t.map(t => '<span class="card-tag" onclick="event.stopPropagation();closeDetail();selectTag(\'' + esc(t) + '\')">#' + esc(t) + '</span>').join('') + '</div>' : ''}
        <a class="open-bot-btn" href="https://t.me/${esc(bot.u)}" target="_blank">🤖 Open @${esc(bot.u)}</a>
    `;
}

function getLangDesc(bot, l) {
    if (l === 'ru') return bot.dr || bot.d;
    if (l === 'fa') return bot.df || bot.d;
    return bot.d;
}

function closeDetail(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('detailOverlay').classList.remove('open');
}

function dateAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = (Date.now() - d) / 86400000;
    if (diff < 1) return 'today';
    if (diff < 30) return Math.round(diff) + 'd ago';
    if (diff < 365) return Math.round(diff / 30) + 'mo ago';
    return Math.round(diff / 365) + 'y ago';
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDetail(); document.getElementById('tagSuggestions').style.display = 'none'; }
});
document.addEventListener('click', function(e) {
    const s = document.getElementById('tagSuggestions');
    if (s && !e.target.closest('.tag-search-wrap')) s.style.display = 'none';
});

// ── Init ──
loadData();
</script>
</body>
</html>
