name: Build and Deploy
on:
  push:
    branches: [main]
    paths: ["data.json"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Generate AI content
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: python generate_content.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: pip install markdown2 httpx
      - run: python build_seo.py
      - run: |
          git config user.email "bot@tgbotarchive.com"
          git config user.name "BotsArchive Bot"
          git add -A
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto rebuild" && git push)
