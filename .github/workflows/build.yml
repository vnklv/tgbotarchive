name: Build and Deploy
on:
  push:
    branches: [main]
    paths: ["data.json"]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Generate AI content (50 bots/hour)
        run: python generate_content.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: pip install markdown2 httpx
      - run: python build_seo.py
      - name: Restore approved pages
        run: |
          git checkout origin/main -- $(cat << 'FILES'
          /b/StylegremBot.html /b/SmartUtilBot.html /b/ig_watch_bot.html /b/AtTime_Presents_Bot.html
          /b/ArtMatcherBot.html /b/anime_for_streaming_bot.html /b/todoeasybot.html /b/AudioFactoryBot.html
          /tag/VPN.html /b/instabot.html /b/poltronarossastreambot.html /b/SocialBooster_aibot.html
          /b/GooGLeSearchBXBot.html /b/smyplaylistbot.html /b/noSVGbot.html /b/HeXa_InFo_BoT.html
          /b/GeminiWRBot.html /b/ChatSizeBot.html /b/xkcd_comicsbot.html /b/UnlimitedQuestionsBot.html
          /b/UserAccountInfoBot.html /b/DreamsOutBot.html /b/PimOnlineBot.html /b/subtitle_translate_bot.html
          /b/HTMLtoPDF_bot.html /b/idstracebot.html /tag/timely.html /b/chaoji.html /b/patrosub_bot.html
          /b/TGCreationDateBot.html /b/DrReactBot.html /b/cats_search_bot.html /b/xD0RMuleBot.html
          /tag/market.html /b/Listentomeplease_bot.html /b/GoodReadsBooksBot.html /b/hintorbot.html
          /b/AJviewCounter_bot.html /b/icybreakerbot.html /b/gpt_fast_bot.html /b/jsoonbot.html
          /b/AcceptRequestBot.html /b/Tzy_TODBot.html /b/NexAutoApproveBot.html /b/cardusbot.html
          /b/deepwerk_io_bot.html /b/K_vp_robot.html /b/GibIDBot.html /b/SocialExchangerBot.html
          /b/Stickerdownloadbot.html /tag/sticker.html /tag/find.html /b/genius_the_bot.html
          /b/AlbumCoverFinderBot.html /tag/digital.html /b/CoC_Italia_Stats_bot.html /b/MathsToolsBot.html
          /b/zenplayerbot.html /tag/animals.html /tag/remove.html /tag/features.html /b/card_teller_bot.html
          /tag/people.html /b/wiki.html /b/InlineTradBot.html /b/JarPlay_Bot.html /b/FootballTeamManagerBot.html
          /b/PinterestVideoDlBot.html /b/SongRefBot.html /tag/film.html /b/subtitle_dl_bot.html /b/TagdBot.html
          /b/foldersbot.html /b/mp3toolsbot.html /b/ThirtyOneBot.html /b/foodometer_bot.html /b/cricbuzz_bot.html
          /b/TicTacToes_Bot.html /b/InspiroRobot.html /tag/searchengine.html /b/Txt2SpeechBot.html
          /b/TrumpQuotes_Bot.html /b/CalcioGoalBot.html /b/UploadBooksBot.html /b/YtConvertAudioBot.html
          /tag/buttons.html /b/PayScribeBot.html /b/TalkMe_chat_bot.html /b/EasyStrongPasswordBot.html
          /b/cloudflarecheckbot.html
          FILES
          ) 2>/dev/null || echo "done"
      - name: Ping search engines
        run: |
          SITEMAP="https://tgbotarchive.com/sitemap.xml"
          curl -s "https://www.google.com/ping?sitemap=$SITEMAP" -o /dev/null -w "Google: %{http_code}\n"
          curl -s "https://www.bing.com/indexnow?url=$SITEMAP&key=spnvi" -o /dev/null -w "Bing: %{http_code}\n"
          curl -s "https://yandex.com/indexnow?url=$SITEMAP" -o /dev/null -w "Yandex: %{http_code}\n"
          curl -s "https://indexnow.ru/IndexNow?url=$SITEMAP" -o /dev/null -w "IndexNow.ru: %{http_code}\n"
      - run: |
          git config user.email "bot@tgbotarchive.com"
          git config user.name "BotsArchive Bot"
          git add -A
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto rebuild" && git push)
