name: Build and Deploy
on:
  push:
    branches: [main]
    paths: ["data.json"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install markdown2
      - run: python build_seo.py
      - run: |
          git config user.email "bot@tgbotarchive.com"
          git config user.name "BotsArchive Bot"
          git add -A
          if git diff --quiet && git diff --cached --quiet; then echo "No changes"; else git commit -m "Auto rebuild"; git push; fi
